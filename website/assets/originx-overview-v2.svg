<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="900" viewBox="0 0 1750 900" role="img" aria-labelledby="title desc">
<title id="title">OriginX overview: adaptation recipe, continuous action conditioning, and stage cues for the frozen policy</title>
<desc id="desc">Panel (a): the public Xiaomi-Robotics-1 checkpoint is adapted with Action LoRA (1,613 updates), frozen, and a continuous B branch is trained (2,000 updates; 4.22M trainable parameters). Panel (b): RGB views and the instruction pass through the frozen encoder; pooled features and proprioception feed the continuous B branch, whose continuous delta is added to the time projection and modulates the frozen action DiT through adaLN to produce the action chunk; a stage loss is used in training only. Panel (c): a frozen Qwen3-VL-4B planner/verifier supplies the stage and a cue controller paints a stage cue on the RGB views: the point cue baseline, the fine-region cue (12 preregistered pairs, 6/10 vs 6/10, no benefit) or the contour-mask cue (pixel fidelity verified on an H800, task outcomes not measured); the policy stays frozen in every arm.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L9.5 5 L0 9.5 z" fill="#2f6fd6"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L9.5 5 L0 9.5 z" fill="#e96a1d"/></marker>
<symbol id="lock" viewBox="0 0 20 24"><rect x="2" y="10" width="16" height="12" rx="2.5" fill="#2f6fd6"/><path d="M5.5 10V7a4.5 4.5 0 0 1 9 0v3" fill="none" stroke="#2f6fd6" stroke-width="2.6"/><circle cx="10" cy="16" r="1.8" fill="#ffffff"/></symbol>
<filter id="sh" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2340" flood-opacity=".08"/></filter>
</defs>
<rect width="1750" height="900" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#1b2340">

<!-- panel dividers -->
<line x1="548" y1="70" x2="548" y2="840" stroke="#d9dde8" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="1240" y1="70" x2="1240" y2="840" stroke="#d9dde8" stroke-width="2" stroke-dasharray="6 6"/>

<!-- ===== (a) Adaptation recipe ===== -->
<text x="60" y="96" font-size="32" font-weight="bold">(a)  Adaptation recipe</text>
<g filter="url(#sh)">
<rect x="90" y="160" width="400" height="104" rx="14" fill="#e3ecfb" stroke="#3b6fd9" stroke-width="2"/>
<rect x="90" y="326" width="400" height="104" rx="14" fill="#e3ecfb" stroke="#3b6fd9" stroke-width="2"/>
<rect x="90" y="492" width="226" height="118" rx="14" fill="#e3ecfb" stroke="#3b6fd9" stroke-width="2"/>
<rect x="346" y="492" width="200" height="118" rx="14" fill="#fde6d2" stroke="#e96a1d" stroke-width="2.5"/>
</g>
<text x="290" y="203" text-anchor="middle" font-size="24" font-weight="bold">Xiaomi-Robotics-1</text>
<text x="290" y="236" text-anchor="middle" font-size="18" fill="#5c6478">Public base checkpoint</text>
<text x="290" y="371" text-anchor="middle" font-size="24" font-weight="bold">Action LoRA</text>
<text x="290" y="402" text-anchor="middle" font-size="18" fill="#5c6478">1,613 updates</text>
<use href="#lock" x="106" y="540" width="20" height="24"/>
<text x="138" y="546" font-size="22" font-weight="bold">Freeze</text>
<text x="138" y="574" font-size="17" fill="#5c6478">adapted policy</text>
<text x="446" y="546" text-anchor="middle" font-size="22" font-weight="bold" fill="#c7501a">Train B branch</text>
<text x="446" y="574" text-anchor="middle" font-size="17" fill="#5c6478">2,000 updates</text>
<path d="M290 264V320" fill="none" stroke="#2f6fd6" stroke-width="3" marker-end="url(#ar)"/>
<path d="M290 430V486" fill="none" stroke="#2f6fd6" stroke-width="3" marker-end="url(#ar)"/>
<path d="M316 551H340" fill="none" stroke="#e96a1d" stroke-width="3" marker-end="url(#aro)"/>
<path d="M352 632 q0 14 14 14 h60 q14 0 14 14 q0 -14 14 -14 h60 q14 0 14 -14" fill="none" stroke="#e96a1d" stroke-width="3"/>
<text x="446" y="700" text-anchor="middle" font-size="22" font-weight="bold" fill="#e96a1d">4.22M trainable parameters</text>
<text x="290" y="770" text-anchor="middle" font-size="16" fill="#5c6478">Author-run RoboCasa365 evaluation: 59.84%</text>
<text x="290" y="794" text-anchor="middle" font-size="16" fill="#5c6478">(2,500 episodes; separate from the leaderboard)</text>

<!-- ===== (b) Continuous action conditioning ===== -->
<text x="590" y="96" font-size="32" font-weight="bold">(b)  Continuous action conditioning</text>
<!-- inputs -->
<rect x="590" y="150" width="250" height="300" rx="14" fill="#f7f8fb" stroke="#c9d0e0" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="715" y="183" text-anchor="middle" font-size="18" font-weight="bold">RGB views + instruction</text>
<rect x="612" y="200" width="150" height="86" rx="6" fill="#d7c4ad" stroke="#b39a7c"/>
<rect x="636" y="214" width="150" height="86" rx="6" fill="#c8d3df" stroke="#9aa8b8"/>
<rect x="660" y="228" width="150" height="86" rx="6" fill="#e7d9c6" stroke="#b39a7c"/>
<rect x="612" y="334" width="206" height="96" rx="10" fill="#ffffff" stroke="#c9d0e0"/>
<text x="715" y="366" text-anchor="middle" font-size="16" fill="#1b2340">“pick up the mug</text>
<text x="715" y="390" text-anchor="middle" font-size="16" fill="#1b2340">and place it</text>
<text x="715" y="414" text-anchor="middle" font-size="16" fill="#1b2340">in the drawer”</text>
<!-- encoder -->
<g filter="url(#sh)">
<path d="M884 196 L1004 226 V354 L884 384 Z" fill="#e3ecfb" stroke="#3b6fd9" stroke-width="2"/>
<path d="M1100 196 L1220 226 V354 L1100 384 Z" fill="#e3ecfb" stroke="#3b6fd9" stroke-width="2"/>
</g>
<use href="#lock" x="934" y="238" width="20" height="24"/>
<text x="944" y="297" text-anchor="middle" font-size="21" font-weight="bold">Frozen</text>
<text x="944" y="324" text-anchor="middle" font-size="21" font-weight="bold">encoder</text>
<use href="#lock" x="1150" y="238" width="20" height="24"/>
<text x="1160" y="297" text-anchor="middle" font-size="21" font-weight="bold">Frozen</text>
<text x="1160" y="324" text-anchor="middle" font-size="21" font-weight="bold">action DiT</text>
<path d="M840 290H878" fill="none" stroke="#2f6fd6" stroke-width="3" marker-end="url(#ar)"/>
<path d="M1004 290H1094" fill="none" stroke="#2f6fd6" stroke-width="3" marker-end="url(#ar)"/>
<!-- action chunk (right of DiT, below panel title) -->
<rect x="1100" y="420" width="120" height="58" rx="12" fill="#e3ecfb" stroke="#3b6fd9" stroke-width="2"/>
<text x="1160" y="446" text-anchor="middle" font-size="16" font-weight="bold">Action chunk</text>
<text x="1160" y="467" text-anchor="middle" font-size="14" fill="#5c6478">16 steps</text>
<path d="M1160 384V414" fill="none" stroke="#2f6fd6" stroke-width="3" marker-end="url(#ar)"/>
<!-- branch -->
<g filter="url(#sh)"><rect x="854" y="520" width="180" height="92" rx="14" fill="#fde6d2" stroke="#e96a1d" stroke-width="2.5"/></g>
<text x="944" y="558" text-anchor="middle" font-size="21" font-weight="bold">Continuous</text>
<text x="944" y="586" text-anchor="middle" font-size="21" font-weight="bold">B branch</text>
<path d="M944 384V514" fill="none" stroke="#2f6fd6" stroke-width="3" marker-end="url(#ar)"/>
<text x="962" y="440" font-size="16" fill="#5c6478">Pooled</text>
<text x="962" y="461" font-size="16" fill="#5c6478">features</text>
<!-- proprioception -->
<rect x="854" y="690" width="180" height="60" rx="12" fill="#f7f8fb" stroke="#c9d0e0" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="944" y="726" text-anchor="middle" font-size="18" font-weight="bold">Proprioception</text>
<path d="M944 690V618" fill="none" stroke="#2f6fd6" stroke-width="3" marker-end="url(#ar)"/>
<!-- continuous delta -> plus -> adaLN -> DiT -->
<circle cx="1160" cy="566" r="17" fill="#ffffff" stroke="#1b2340" stroke-width="2.5"/>
<path d="M1151 566H1169M1160 557V575" stroke="#1b2340" stroke-width="2.5"/>
<path d="M1034 566H1137" fill="none" stroke="#e96a1d" stroke-width="3" marker-end="url(#aro)"/>
<text x="1086" y="553" text-anchor="middle" font-size="16" font-weight="bold" fill="#e96a1d">Continuous delta</text>
<path d="M1160 549V484" fill="none" stroke="#2f6fd6" stroke-width="3" marker-end="url(#ar)"/>
<text x="1174" y="512" font-size="15" fill="#5c6478">adaLN</text>
<text x="1174" y="531" font-size="15" fill="#5c6478">modulation</text>
<!-- time projection -->
<rect x="1070" y="620" width="160" height="60" rx="12" fill="#e3ecfb" stroke="#3b6fd9" stroke-width="2"/>
<use href="#lock" x="1082" y="638" width="18" height="22"/>
<text x="1162" y="645" text-anchor="middle" font-size="16" font-weight="bold">Time</text>
<text x="1162" y="666" text-anchor="middle" font-size="16" font-weight="bold">projection</text>
<path d="M1160 620V589" fill="none" stroke="#2f6fd6" stroke-width="3" marker-end="url(#ar)"/>
<!-- stage loss -->
<rect x="590" y="520" width="200" height="92" rx="12" fill="#f3f4f8" stroke="#8b93a7" stroke-width="1.5"/>
<text x="690" y="558" text-anchor="middle" font-size="19" font-weight="bold" fill="#3c4458">Stage loss</text>
<text x="690" y="586" text-anchor="middle" font-size="15" fill="#5c6478">training only</text>
<path d="M854 566H796" fill="none" stroke="#e96a1d" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aro)"/>
<!-- legend -->
<rect x="590" y="780" width="640" height="54" rx="10" fill="#ffffff" stroke="#d9dde8"/>
<use href="#lock" x="612" y="795" width="18" height="22"/><text x="640" y="813" font-size="17">Frozen</text>
<rect x="740" y="796" width="30" height="20" rx="5" fill="#fde6d2" stroke="#e96a1d" stroke-width="2"/><text x="782" y="813" font-size="17">Trainable</text>
<line x1="900" y1="807" x2="960" y2="807" stroke="#e96a1d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="972" y="813" font-size="17">Training only</text>

<!-- ===== (c) Stage cues for the frozen policy ===== -->
<text x="1282" y="96" font-size="32" font-weight="bold">(c)  Stage cues, policy frozen</text>
<rect x="1282" y="150" width="408" height="92" rx="14" fill="#e3ecfb" stroke="#3b6fd9" stroke-width="2"/>
<use href="#lock" x="1298" y="183" width="20" height="24"/>
<text x="1330" y="186" font-size="20" font-weight="bold">Qwen3-VL-4B planner / verifier</text>
<text x="1330" y="214" font-size="16" fill="#5c6478">frozen · supplies the active stage</text>
<path d="M1486 242V282" fill="none" stroke="#2f6fd6" stroke-width="3" marker-end="url(#ar)"/>
<rect x="1282" y="288" width="408" height="400" rx="14" fill="#f7f8fb" stroke="#8b93a7" stroke-width="1.5"/>
<text x="1486" y="322" text-anchor="middle" font-size="20" font-weight="bold">Cue controller</text>
<text x="1486" y="346" text-anchor="middle" font-size="15" fill="#5c6478">paints the stage cue on the RGB views in (b)</text>
<rect x="1300" y="366" width="372" height="78" rx="10" fill="#ffffff" stroke="#c9d0e0"/>
<text x="1316" y="394" font-size="18" font-weight="bold">Point cue · baseline</text>
<text x="1316" y="420" font-size="15" fill="#5c6478">frozen box + crosshair controller</text>
<rect x="1300" y="458" width="372" height="100" rx="10" fill="#ffffff" stroke="#c9d0e0"/>
<text x="1316" y="486" font-size="18" font-weight="bold">Fine-region cue · study done</text>
<text x="1316" y="512" font-size="15" fill="#5c6478">12 preregistered pairs: 6/10 vs 6/10, p = 1</text>
<text x="1316" y="536" font-size="15" fill="#5c6478">no benefit established</text>
<rect x="1300" y="572" width="372" height="100" rx="10" fill="#ffffff" stroke="#e96a1d" stroke-width="1.5"/>
<text x="1316" y="600" font-size="18" font-weight="bold">Contour-mask cue · built</text>
<text x="1316" y="626" font-size="15" fill="#5c6478">pixel fidelity verified on an H800 (11/12 checks)</text>
<text x="1316" y="650" font-size="15" fill="#5c6478">task outcomes not measured</text>
<path d="M1282 400 H1252 V290 H1240" fill="none" stroke="#2f6fd6" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="1486" y="730" text-anchor="middle" font-size="16" fill="#5c6478">Paired, preregistered protocol · 12 unused seed pairs</text>
<text x="1486" y="754" text-anchor="middle" font-size="16" fill="#5c6478">exact McNemar test · unknowns stay unknown</text>
<text x="1486" y="813" text-anchor="middle" font-size="17" fill="#5c6478">Only the cue changes; weights, actions and stage rules do not</text>
</g>
</svg>
