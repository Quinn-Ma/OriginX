<svg xmlns="http://www.w3.org/2000/svg" width="380" height="560" viewBox="0 0 380 560" role="img" aria-labelledby="title desc">
<title id="title">OriginX mobile architecture diagram</title>
<desc id="desc">Observation features and robot state feed a frozen Xiaomi-Robotics-1 policy with A1613 Action LoRA and a trainable continuous conditioning branch with 4.22 million parameters. Both pathways condition native action generation. Inference does not use ground-truth stage labels.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070c20"/><stop offset="1" stop-color="#121836"/></linearGradient>
  <linearGradient id="branch" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3359ea"/><stop offset="1" stop-color="#6856d9"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#8aa2ff" stroke-width="1.4"/></marker>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#435689" opacity=".36"/></pattern>
</defs>
<rect width="380" height="560" rx="18" fill="url(#bg)"/>
<rect width="380" height="560" rx="18" fill="url(#dots)"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
  <text x="190" y="59" font-size="40" letter-spacing="-1.5" fill="#f1f4ff">Origin<tspan fill="#8199ff">X</tspan></text>
  <text x="190" y="85" font-size="14" fill="#91a3d5">Continuous conditioning for robot policies</text>

  <rect x="34" y="114" width="312" height="82" rx="15" fill="#151f41" stroke="#3a507f"/>
  <text x="190" y="140" font-size="13" letter-spacing="1.2" fill="#9eb2e7">OBSERVE</text>
  <text x="190" y="168" font-size="19" fill="#e1e8ff">Features + robot state</text>
  <path d="M190 196V220M103 241V220H277V241" fill="none" stroke="#6383ff" stroke-width="1.8"/>
  <circle cx="190" cy="220" r="3.5" fill="#8aa2ff"/>

  <rect x="23" y="242" width="160" height="133" rx="15" fill="#172145" stroke="#3a507f"/>
  <text x="103" y="267" font-size="12" letter-spacing="1.1" fill="#9eb2e7">FROZEN POLICY</text>
  <text x="103" y="296" font-size="18" fill="#e1e8ff">Xiaomi</text>
  <text x="103" y="319" font-size="18" fill="#e1e8ff">Robotics-1</text>
  <text x="103" y="349" font-size="14" fill="#9eb2e7">+ A1613 LoRA</text>

  <rect x="197" y="242" width="160" height="133" rx="15" fill="url(#branch)" stroke="#8b9df3" stroke-opacity=".45"/>
  <text x="277" y="267" font-size="12" letter-spacing="1.1" fill="#e0e6ff">TRAINABLE</text>
  <text x="277" y="296" font-size="18" fill="#fff">Continuous</text>
  <text x="277" y="319" font-size="18" fill="#fff">branch</text>
  <text x="277" y="349" font-size="14" fill="#e0e6ff">4.22M parameters</text>

  <path d="M103 375V397H277V375M190 397V424" fill="none" stroke="#6383ff" stroke-width="1.8"/>
  <path d="M190 413V425" fill="none" stroke="#8aa2ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="190" cy="397" r="3.5" fill="#8aa2ff"/>
  <rect x="34" y="430" width="312" height="83" rx="15" fill="#151f41" stroke="#3a507f"/>
  <text x="190" y="456" font-size="18" fill="#e1e8ff">Native action generation</text>
  <text x="190" y="486" font-size="14" fill="#9eb2e7">5 Euler steps · replan every 16</text>
  <text x="190" y="540" font-size="12" fill="#91a3d5">Observation-based inference · no true stage labels</text>
</g>
</svg>
