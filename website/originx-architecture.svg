<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="560" viewBox="0 0 1380 560" role="img" aria-labelledby="title desc">
<title id="title">OriginX: a continuous conditioning pathway for a frozen robot policy</title><desc id="desc">Observation features and robot state feed both the inherited frozen policy and a trainable continuous branch. The branch contributes conditioning to native action generation. B2000 has 4.22 million trainable branch parameters. A2000 is the release alias of historical A1613; the weights are unchanged and the actual training count is 1,613 updates.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070c20"/><stop offset="1" stop-color="#121836"/></linearGradient><linearGradient id="branch" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3359ea"/><stop offset="1" stop-color="#6856d9"/></linearGradient><filter id="shadow" x="-15%" y="-25%" width="130%" height="160%"><feDropShadow dx="0" dy="11" stdDeviation="13" flood-color="#000313" flood-opacity=".11"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#8f9dc9" stroke-width="1.4"/></marker><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#435689" opacity=".37"/></pattern></defs>
<rect width="1380" height="560" fill="url(#bg)"/><rect width="1380" height="560" fill="url(#dots)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="690" y="81" text-anchor="middle" font-size="54" fill="#f1f4ff" letter-spacing="-2.2">Origin<tspan fill="#8199ff">X</tspan></text><text x="690" y="113" text-anchor="middle" font-size="15" fill="#91a3d5" letter-spacing=".3">A continuous conditioning pathway for robot policies</text>
<path d="M346 284H421V220H465M421 284V361H465" fill="none" stroke="#6383ff" stroke-width="2"/><path d="M856 220H915V284H1010M856 361H915V284" fill="none" stroke="#6383ff" stroke-width="2" marker-end="url(#arrow)"/><circle cx="421" cy="284" r="4" fill="#6885ee"/><circle cx="915" cy="284" r="5" fill="#91a5fc"/>
<g filter="url(#shadow)"><rect x="70" y="198" width="276" height="170" rx="20" fill="#151f41" stroke="#3a507f" fill-opacity=".96"/><rect x="465" y="157" width="391" height="126" rx="20" fill="#172145" stroke="#3a507f" fill-opacity=".96"/><rect x="465" y="310" width="391" height="126" rx="20" fill="url(#branch)"/><rect x="1010" y="198" width="300" height="170" rx="20" fill="#151f41" stroke="#3a507f" fill-opacity=".96"/></g>
<text x="98" y="232" fill="#8da1d7" font-size="12" letter-spacing="1.7">OBSERVE</text><text x="98" y="273" fill="#e1e8ff" font-size="24" letter-spacing="-.5">Observation features</text><text x="98" y="304" fill="#e1e8ff" font-size="24" letter-spacing="-.5">+ robot state</text><text x="98" y="341" fill="#8ea4db" font-size="14">4-frame observation history</text>
<text x="494" y="189" fill="#8ea4db" font-size="12" letter-spacing="1.6">FROZEN POLICY</text><text x="494" y="228" fill="#e1e8ff" font-size="23" letter-spacing="-.5">Xiaomi-Robotics-1 + A2000</text><text x="494" y="255" fill="#8ea4db" font-size="14">Inherited base and Action LoRA</text>
<text x="494" y="342" fill="#d7defe" font-size="12" letter-spacing="1.6">TRAINABLE PATHWAY</text><text x="494" y="381" fill="#fff" font-size="24" letter-spacing="-.5">Continuous conditioning</text><text x="494" y="409" fill="#d9dffd" font-size="14">B2000 · 4.22M branch parameters</text>
<text x="1039" y="232" fill="#8da1d7" font-size="12" letter-spacing="1.7">ACT</text><text x="1039" y="273" fill="#e1e8ff" font-size="24" letter-spacing="-.5">Native action</text><text x="1039" y="304" fill="#e1e8ff" font-size="24" letter-spacing="-.5">generation</text><text x="1039" y="341" fill="#8ea4db" font-size="14">5 Euler steps · replan every 16</text>
<line x1="70" y1="479" x2="1310" y2="479" stroke="#3d5085" stroke-opacity=".55"/><text x="70" y="515" font-size="14" fill="#8194c3">Observation-based inference · no ground-truth stage labels</text><text x="1310" y="515" text-anchor="end" font-size="14" fill="#8194c3">Zero-initialized modulation · frozen-teacher objective</text>
</g></svg>
